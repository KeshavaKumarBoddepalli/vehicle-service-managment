<div class="container">
  <h2 class="title">All Services</h2>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <table class="service-table" *ngIf="services.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Service Name</th>
        <th>Price</th>
        <th>Vehicle Type</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let service of services">
        <td>{{ service.serviceId }}</td>
        <td>{{ service.serviceName }}</td>
        <td>{{ service.servicePrice }}</td>
        <td>{{ service.typeOfVehicle }}</td>
        <td>
          <button class="btn edit-btn" (click)="editService(service)">Edit</button>
          <button class="btn delete-btn" (click)="deleteService(service.serviceId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="services.length === 0 && !errorMessage" class="no-data">
    No services available.
  </div>
</div>
