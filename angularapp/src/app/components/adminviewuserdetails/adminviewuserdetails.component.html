<div class="container">
    <h2>Customer List</h2>
    <div class="search-box">
      <input type="text" [(ngModel)]="searchTerm" placeholder="Enter the username">
      <button (click)="searchUser()">Search</button>
    </div>
  
    <table>
      <thead>
        <tr>
          <th>S. NO</th>
          <th>Customer Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Mobile Number</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.userRole }}</td>
          <td>{{ user.mobileNumber }}</td>
          <td>
            <button class="delete-btn" (click)="deleteUser(user.userId)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
