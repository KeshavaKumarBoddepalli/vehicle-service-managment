<div class="feedback-form-container">
  <h2>Submit Your Feedback</h2>
 
  <form (ngSubmit)="submitFeedback()" #feedbackForm="ngForm" class="feedback-form">
 
    <div class="form-group">
      <label for="message">Message:</label>
      <textarea
        id="message"
        name="message"
        [(ngModel)]="newFeedback.message"
        required
        placeholder="Write your feedback here..."
        pattern="^[a-zA-Z ]+$"
        #message="ngModel"
      ></textarea>
      <div *ngIf="message.invalid && message.touched" class="error">
        <span *ngIf="message.errors?.required">Message is required.</span>
        <span *ngIf="message.errors?.pattern">Only letters and spaces are allowed.</span>
      </div>
    </div>
 
    <div class="form-group">
      <label for="rating">Rating:</label>
      <input
        type="number"
        id="rating"
        name="rating"
        [(ngModel)]="newFeedback.rating"
        min="1"
        max="5"
        required
        placeholder="Enter rating (1-5)"
        (input)="validateRating($event)"
        #rating="ngModel"
      />
      <div *ngIf="rating.invalid && rating.touched" class="error">
        <span *ngIf="rating.errors?.required">Rating is required.</span>
        <span *ngIf="rating.errors?.min || rating.errors?.max">Rating must be between 1 and 5.</span>
      </div>
    </div>
 
    <button type="submit" class="btn-submit" [disabled]="feedbackForm.invalid">
      Submit Feedback
    </button>
  </form>
</div>
